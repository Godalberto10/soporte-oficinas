[project]
name = "office-support"
version = "0.1.0"
description = "Technical support for an office network: a multi-agent system"
readme = "README.md"
authors = [
    { name = "Godalberto10", email = "aolmosa17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
office-support = "office_support.interfaces.cli:main"
office-support-web = "office_support.interfaces.server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
web = [
    "streamlit>=1.66.0",
]
